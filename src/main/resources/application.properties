spring.application.name=taskmanager

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# PostgreSQL (Railway automatically injects these variables)
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.tomcat.threads.max=20

spring.h2.console.enabled=false

app.admin.name=${DEFAULT_ADMIN_NAME:Project Admin}
app.admin.email=${DEFAULT_ADMIN_EMAIL:admin23@task.com}
app.admin.password=${DEFAULT_ADMIN_PASSWORD:admin@123}
app.admin.reset-password-on-startup=${DEFAULT_ADMIN_RESET_PASSWORD:true}
